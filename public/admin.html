<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin – Burger King</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" />
  <style>
    :root {
      --red:    #D62300;
      --orange: #FF8732;
      --yellow: #FFAA00;
      --brown:  #502314;
      --cream:  #F5EBDC;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; min-height: 100vh; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #3d1a0d 0%, #D62300 30%, #FF8732 65%, #FFAA00 85%, #F5EBDC 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      border: 2.5px solid var(--brown);
      box-shadow: 6px 6px 0 var(--brown);
      padding: 36px 28px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .bk-logo { height: 60px; }

    h1 {
      font-family: 'Lilita One', cursive;
      color: var(--red);
      font-size: 1.6rem;
      text-align: center;
      line-height: 1.2;
    }

    /* ── Login form ── */
    .field {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: 700;
      font-size: .85rem;
      color: var(--brown);
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--brown);
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      background: var(--cream);
      color: var(--brown);
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--red); }

    /* ── Btn ── */
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 99px;
      font-family: 'Lilita One', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--brown);
      transition: transform .1s, box-shadow .1s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown); }
    .btn:disabled { opacity: .6; cursor: default; }

    .btn-sm {
      width: auto;
      padding: 8px 20px;
      font-size: .9rem;
      background: transparent;
      color: var(--brown);
      border: 2px solid var(--brown);
      box-shadow: none;
    }
    .btn-sm:active { transform: none; }

    /* ── Error msg ── */
    .error-msg {
      color: var(--red);
      font-size: .85rem;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
    }

    /* ── Dashboard ── */
    .divider {
      width: 100%;
      border: none;
      border-top: 2px dashed rgba(80,35,20,.2);
    }

    .toggle-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .toggle-label {
      font-family: 'Lilita One', cursive;
      font-size: 1.05rem;
      color: var(--brown);
      line-height: 1.3;
    }
    .toggle-sub {
      font-size: .78rem;
      font-weight: 600;
      color: rgba(80,35,20,.6);
      margin-top: 2px;
    }

    /* Toggle switch */
    .toggle-switch { position: relative; width: 58px; height: 30px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: rgba(80,35,20,.25);
      border-radius: 99px;
      cursor: pointer;
      transition: background .3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .3s;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    .toggle-switch input:checked + .slider { background: var(--red); }
    .toggle-switch input:checked + .slider::before { transform: translateX(28px); }

    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-on  { background: #198737; }
    .status-off { background: rgba(80,35,20,.3); }

    .status-line {
      font-size: .82rem;
      font-weight: 600;
      color: rgba(80,35,20,.65);
      text-align: center;
    }

    .user-info {
      font-size: .8rem;
      color: rgba(80,35,20,.5);
      text-align: center;
    }

    /* ── Stats ── */
    .stats-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .stat-total-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .stat-total-num {
      font-family: 'Lilita One', cursive;
      font-size: 2.6rem;
      color: var(--red);
      line-height: 1;
    }
    .stat-total-label {
      font-weight: 700;
      font-size: .9rem;
      color: var(--brown);
    }
    .stat-stars {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .stat-star-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      font-weight: 700;
    }
    .stat-star-label { color: var(--brown); width: 22px; flex-shrink: 0; }
    .stat-bar-track {
      flex: 1;
      height: 10px;
      background: rgba(80,35,20,.12);
      border-radius: 99px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      background: var(--orange);
      border-radius: 99px;
      transition: width .4s ease;
    }
    .stat-star-count { color: rgba(80,35,20,.55); width: 28px; text-align: right; flex-shrink: 0; }
    .stat-prizes-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stat-prizes-title {
      font-family: 'Lilita One', cursive;
      font-size: .9rem;
      color: var(--brown);
    }
    .stat-prizes-meta {
      font-size: .75rem;
      font-weight: 700;
      color: rgba(80,35,20,.5);
    }
    .stat-prize-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 7px;
      font-size: .8rem;
      font-weight: 700;
      color: var(--brown);
      padding: 4px 0;
    }
    .stat-prize-bar-track {
      width: 60px;
      height: 7px;
      background: rgba(80,35,20,.12);
      border-radius: 99px;
      overflow: hidden;
    }
    .stat-prize-bar-fill {
      height: 100%;
      background: var(--red);
      border-radius: 99px;
      transition: width .4s ease;
    }
    .stat-prize-count {
      color: rgba(80,35,20,.7);
      font-size: .8rem;
      min-width: 18px;
      text-align: right;
    }
    .stat-prize-pct {
      color: rgba(80,35,20,.45);
      font-size: .75rem;
      min-width: 34px;
      text-align: right;
    }
    .stat-taux {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem;
      font-weight: 700;
      color: rgba(80,35,20,.6);
      margin-top: 2px;
    }
    .stat-taux-num {
      font-family: 'Lilita One', cursive;
      font-size: 1.2rem;
      color: var(--orange);
    }
    .stat-empty {
      font-size: .82rem;
      color: rgba(80,35,20,.4);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ── Login ── -->
  <div class="card" id="login-section">
    <img class="bk-logo" src="images/bk-logo.png" alt="Burger King" />
    <h1>Administration</h1>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" placeholder="admin@burgerking.fr" />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
    </div>

    <p class="error-msg" id="login-error"></p>
    <button class="btn" id="login-btn">Se connecter</button>
  </div>

  <!-- ── Dashboard ── -->
  <div class="card" id="dashboard-section" style="display:none">
    <img class="bk-logo" src="images/bk-logo.png" alt="Burger King" />
    <h1>Dashboard</h1>
    <hr class="divider" />

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Roulette après avis</div>
        <div class="toggle-sub" id="toggle-sub">Chargement…</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="roulette-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <hr class="divider" />

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Envoi d'email</div>
        <div class="toggle-sub" id="email-toggle-sub">Chargement…</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="email-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <p class="status-line" id="status-line"></p>
    <hr class="divider" />

    <div class="stats-section" id="stats-section">
      <div class="stat-total-wrap">
        <span class="stat-total-num" id="stat-total">–</span>
        <span class="stat-total-label">avis reçus</span>
      </div>

      <div class="stat-stars" id="stat-stars">
        <div class="stat-star-row">
          <span class="stat-star-label">4★</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-4" style="width:0%"></div></div>
          <span class="stat-star-count" id="count-4">–</span>
        </div>
        <div class="stat-star-row">
          <span class="stat-star-label">3★</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-3" style="width:0%"></div></div>
          <span class="stat-star-count" id="count-3">–</span>
        </div>
        <div class="stat-star-row">
          <span class="stat-star-label">2★</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-2" style="width:0%"></div></div>
          <span class="stat-star-count" id="count-2">–</span>
        </div>
        <div class="stat-star-row">
          <span class="stat-star-label">1★</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-1" style="width:0%"></div></div>
          <span class="stat-star-count" id="count-1">–</span>
        </div>
      </div>

      <div>
        <div class="stat-prizes-header">
          <div class="stat-prizes-title">Produits gagnés</div>
          <div class="stat-prizes-meta" id="stat-prizes-meta"></div>
        </div>
        <div id="stat-prizes-list"><span class="stat-empty">Aucun avis encore</span></div>
        <div class="stat-taux" id="stat-taux" style="display:none;margin-top:10px">
          <span class="stat-taux-num" id="stat-taux-num">–</span>
          <span>taux roulette</span>
        </div>
      </div>
    </div>

    <hr class="divider" />
    <a class="btn btn-sm" id="avis-link" href="/avis" style="text-align:center;text-decoration:none;display:block">Voir les avis →</a>
    <hr class="divider" />
    <p class="user-info" id="user-info"></p>
    <button class="btn btn-sm" id="logout-btn">Se déconnecter</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
