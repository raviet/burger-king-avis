<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Votre avis – Burger King</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#d22830" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="bk-header">
    <div class="bk-logo-wrap">
      <img class="bk-logo" src="images/bk-logo.png" alt="Burger King" />
    </div>
  </header>

  <main class="bk-main">
    <div class="card">
      <h1>Comment s'est passée<br>votre visite ?</h1>
      <p class="subtitle">Votre avis nous aide à nous améliorer</p>

      <div class="stars" role="group" aria-label="Sélectionnez une note de 1 à 5 étoiles">
        <span class="star" data-value="1" role="button" tabindex="0" aria-label="1 étoile"><img src="images/star.png" alt="★" /></span>
        <span class="star" data-value="2" role="button" tabindex="0" aria-label="2 étoiles"><img src="images/star.png" alt="★" /></span>
        <span class="star" data-value="3" role="button" tabindex="0" aria-label="3 étoiles"><img src="images/star.png" alt="★" /></span>
        <span class="star" data-value="4" role="button" tabindex="0" aria-label="4 étoiles"><img src="images/star.png" alt="★" /></span>
        <span class="star" data-value="5" role="button" tabindex="0" aria-label="5 étoiles"><img src="images/star.png" alt="★" /></span>
      </div>

      <p class="stars-hint" id="stars-hint">Appuyez sur une étoile pour donner votre note</p>
    </div>
  </main>

  <div class="bk-footer-strip"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
