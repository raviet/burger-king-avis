<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Votre avis – Burger King</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="logo">🍔</div>
    <div class="brand">Burger King</div>

    <div class="divider"></div>

    <h1>Comment s'est passée votre visite ?</h1>
    <p class="subtitle">Votre avis nous aide à nous améliorer</p>

    <div class="stars" role="group" aria-label="Sélectionnez une note de 1 à 5 étoiles">
      <span class="star" data-value="1" role="button" tabindex="0" aria-label="1 étoile">★</span>
      <span class="star" data-value="2" role="button" tabindex="0" aria-label="2 étoiles">★</span>
      <span class="star" data-value="3" role="button" tabindex="0" aria-label="3 étoiles">★</span>
      <span class="star" data-value="4" role="button" tabindex="0" aria-label="4 étoiles">★</span>
      <span class="star" data-value="5" role="button" tabindex="0" aria-label="5 étoiles">★</span>
    </div>

    <p class="stars-hint" id="stars-hint">Appuyez sur une étoile pour donner votre note</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
