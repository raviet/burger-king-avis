<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Avis clients – Burger King</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#d22830" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" />
  <style>
    :root {
      --red:    #D62300;
      --orange: #FF8732;
      --yellow: #FFAA00;
      --brown:  #502314;
      --cream:  #F5EBDC;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; min-height: 100vh; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #3d1a0d 0%, #D62300 30%, #FF8732 65%, #FFAA00 85%, #F5EBDC 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .page-card {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      border: 2.5px solid var(--brown);
      box-shadow: 6px 6px 0 var(--brown);
      padding: 28px 24px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .page-title {
      font-family: 'Lilita One', cursive;
      color: var(--red);
      font-size: 1.5rem;
    }
    .back-link {
      font-size: .82rem;
      font-weight: 700;
      color: var(--brown);
      text-decoration: none;
      opacity: .6;
      transition: opacity .15s;
    }
    .back-link:hover { opacity: 1; }

    .divider {
      border: none;
      border-top: 2px dashed rgba(80,35,20,.2);
    }

    /* ── Filtres ── */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: 99px;
      border: 2px solid rgba(80,35,20,.25);
      background: transparent;
      font-family: 'Nunito', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      color: var(--brown);
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* ── Compteur ── */
    .avis-count {
      font-size: .82rem;
      font-weight: 600;
      color: rgba(80,35,20,.5);
    }

    /* ── Liste avis ── */
    .avis-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .avis-card {
      background: var(--cream);
      border-radius: 14px;
      border: 1.5px solid rgba(80,35,20,.15);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .avis-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .avis-stars {
      font-size: 1rem;
      letter-spacing: 1px;
      line-height: 1;
    }
    .avis-date {
      font-size: .75rem;
      font-weight: 600;
      color: rgba(80,35,20,.45);
      flex-shrink: 0;
    }
    .avis-message {
      font-size: .9rem;
      font-weight: 600;
      color: var(--brown);
      line-height: 1.45;
      word-break: break-word;
    }
    .avis-prize {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--red);
      color: #fff;
      font-size: .72rem;
      font-weight: 700;
      align-self: flex-start;
    }

    .empty-state {
      text-align: center;
      font-size: .88rem;
      font-weight: 600;
      color: rgba(80,35,20,.4);
      font-style: italic;
      padding: 16px 0;
    }

    #loading-state {
      text-align: center;
      font-size: .88rem;
      color: rgba(80,35,20,.4);
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <div class="page-card" id="avis-section" style="display:none">
    <div class="page-header">
      <div class="page-title">Avis clients</div>
      <a class="back-link" href="/admin">← Dashboard</a>
    </div>

    <hr class="divider" />

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="4">4★</button>
      <button class="filter-btn" data-filter="3">3★</button>
      <button class="filter-btn" data-filter="2">2★</button>
      <button class="filter-btn" data-filter="1">1★</button>
    </div>

    <div id="loading-state">Chargement…</div>
    <div class="avis-count" id="avis-count" style="display:none"></div>
    <div class="avis-list" id="avis-list"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="config.js"></script>
  <script src="avis.js"></script>
</body>
</html>
